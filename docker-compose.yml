services:
  iris:
    container_name: agentic-production-iris
    build:
      context: .
      dockerfile: Dockerfile
    env_file: 
      .env
    restart: always
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
      # libirisotel reads these; .env can override. Without the observability profile the
      # host does not resolve and spans are dropped (TracingEnabled is off by default anyway)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-iris-agentic-production}
    ports:
      - 1972:1972
      - 52773:52773
      - 8080:8080
    volumes:
      - ./:/home/irisowner/dev

  # docker compose --profile observability up -d
  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-iris-agentic-production}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - 16686:16686
